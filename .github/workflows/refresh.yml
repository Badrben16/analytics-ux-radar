name: Refresh UX Analytics Radar

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/news.json"
      - "data/history.json"
  schedule:
    - cron: "15 6 * * 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh radar data
        run: python -m scripts.refresh

      - name: Commit refreshed data
        run: |
          git config user.name "analytics-ux-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh radar data"
            git push
          fi
